<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestão & PDV</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="navbar">
    <div class="brand">
      <span class="logo-icon">📊</span>
      <h1>StockMaster <span>PDV</span></h1>
    </div>
    <span class="badge">Painel Administrativo</span>
  </header>

  <main class="container">
    <!-- Métricas / Dashboard -->
    <section class="kpi-grid">
      <div class="kpi-card">
        <h3>Total em Estoque</h3>
        <p id="total-produtos">0 itens</p>
      </div>
      <div class="kpi-card">
        <h3>Faturamento Total</h3>
        <p id="faturamento-total" class="highlight">R$ 0,00</p>
      </div>
      <div class="kpi-card">
        <h3>Vendas Realizadas</h3>
        <p id="total-vendas">0 vendas</p>
      </div>
    </section>

    <!-- Área de Cadastro e Venda -->
    <div class="work-grid">
      <!-- Formulário de Cadastro -->
      <section class="card form-card">
        <h2>Cadastrar Produto</h2>
        <form id="form-produto">
          <div class="input-group">
            <label for="nome">Nome do Produto</label>
            <input type="text" id="nome" placeholder="Ex: Teclado Mecânico" required>
          </div>
          <div class="input-row">
            <div class="input-group">
              <label for="preco">Preço Unitário (R$)</label>
              <input type="number" id="preco" step="0.01" min="0.01" placeholder="99.90" required>
            </div>
            <div class="input-group">
              <label for="quantidade">Quantidade</label>
              <input type="number" id="quantidade" min="1" placeholder="10" required>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Adicionar ao Estoque</button>
        </form>
      </section>

      <!-- Terminal de Venda Rápida -->
      <section class="card form-card">
        <h2>Registrar Venda</h2>
        <form id="form-venda">
          <div class="input-group">
            <label for="select-produto">Selecione o Produto</label>
            <select id="select-produto" required>
              <option value="" disabled selected>Selecione um item</option>
            </select>
          </div>
          <div class="input-row">
            <div class="input-group">
              <label for="qtd-venda">Quantidade a Vender</label>
              <input type="number" id="qtd-venda" min="1" value="1" required>
            </div>
            <div class="input-group">
              <label>Total Previsto</label>
              <div id="prev-total" class="prev-box">R$ 0,00</div>
            </div>
          </div>
          <button type="submit" class="btn btn-success">Confirmar Venda</button>
        </form>
      </section>
    </div>

    <!-- Tabela de Produtos -->
    <section class="card table-card">
      <div class="table-header">
        <h2>Estoque Atual</h2>
        <input type="text" id="busca-produto" placeholder="Buscar produto..." class="search-input">
      </div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Produto</th>
              <th>Preço Unitário</th>
              <th>Em Estoque</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tbody-estoque">
            <!-- Linhas preenchidas via JS -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- Histórico de Vendas -->
    <section class="card table-card">
      <h2>Histórico Recente de Vendas</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Data/Hora</th>
              <th>Item</th>
              <th>Qtd</th>
              <th>Valor Total</th>
            </tr>
          </thead>
          <tbody id="tbody-historico">
            <!-- Linhas preenchidas via JS -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
